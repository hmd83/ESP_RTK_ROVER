; ESP_RTK_ROVER - transparent Bluetooth <-> UART bridge for an RTK GNSS receiver.
;
; Default env is Bluetooth Classic SPP on the ESP32 DevKitC: the phone pairs
; from its normal Bluetooth menu and any GNSS app that offers "choose a paired
; Bluetooth device" works. Only the original ESP32 has a Classic radio.

[platformio]
default_envs = esp32dev_spp

[env]
; ESP32-C6 needs Arduino core 3.x, which only ships in the pioarduino fork of
; platform-espressif32. It builds the classic ESP32 too, so one platform covers
; every env here.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_flags = -DCORE_DEBUG_LEVEL=0

; --------------------------------------------------------------------------
; ESP32 DevKitC - Bluetooth Classic SPP  (default; pairs like a USB-TTL dongle)
; --------------------------------------------------------------------------
[env:esp32dev_spp]
board = esp32dev
; Bluedroid + Classic is large; the default 1.4 MB app partition is too tight.
board_build.partitions = huge_app.csv
build_src_filter = +<*> -<link_ble.cpp>
build_flags =
	${env.build_flags}
	-DGNSS_UART_NUM=2
	-DPIN_GNSS_RX=16
	-DPIN_GNSS_TX=17

; --------------------------------------------------------------------------
; ESP32 DevKitC - BLE Nordic UART Service  (for apps with an explicit BLE mode)
; --------------------------------------------------------------------------
[env:esp32dev_ble]
board = esp32dev
build_src_filter = +<*> -<link_spp.cpp>
build_flags =
	${env.build_flags}
	-DGNSS_UART_NUM=2
	-DPIN_GNSS_RX=16
	-DPIN_GNSS_TX=17
lib_deps = h2zero/NimBLE-Arduino@^2.5.1

; --------------------------------------------------------------------------
; Seeed XIAO ESP32-C6 - BLE only (this chip has no Bluetooth Classic radio)
; --------------------------------------------------------------------------
[env:xiao_esp32c6_ble]
board = seeed_xiao_esp32c6
build_src_filter = +<*> -<link_spp.cpp>
build_flags =
	${env.build_flags}
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DGNSS_UART_NUM=1
	-DPIN_GNSS_RX=17
	-DPIN_GNSS_TX=16
	-DLED_ACTIVE_LOW=1
lib_deps = h2zero/NimBLE-Arduino@^2.5.1
